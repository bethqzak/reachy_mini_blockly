name: Sync to Hugging Face Space

# GitHub is the development repo; the HF Space is the publishing endpoint the
# Reachy Mini dashboard installs and updates from. Every push to main is
# mirrored to the Space so "Update available" keeps working.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git push --force \
            "https://bethfromcurtin:${HF_TOKEN}@huggingface.co/spaces/bethfromcurtin/reachy_mini_blockly" \
            main
